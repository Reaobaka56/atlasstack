name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, Lint & Security
    runs-on: ubuntu-latest

    env:
      LITE_MODE: "true"
      JWT_SECRET: "ci-test-secret-not-for-production"
      DEBUG: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install pytest pytest-cov pytest-asyncio flake8 black isort bandit

      - name: Install analysis dependencies
        run: pip install -r services/analysis/requirements.txt
        continue-on-error: true  # Heavy ML deps may fail in CI

      - name: Format check (black)
        run: black --check services/api/ shared/ --line-length 100
        continue-on-error: true

      - name: Import sort check (isort)
        run: isort --check-only services/api/ shared/
        continue-on-error: true

      - name: Lint (flake8)
        run: flake8 services/api/ shared/ --max-line-length=100 --ignore=E501,W503
        continue-on-error: true

      - name: Security scan (bandit)
        run: bandit -r services/api/ shared/ -ll --exclude tests/
        continue-on-error: true

      - name: Run unit tests
        run: |
          cd services/api
          python -m pytest ../../tests/unit/ -v --tb=short
        continue-on-error: true

      - name: Run integration tests
        run: |
          cd services/api
          python -m pytest ../../tests/integration/ -v --tb=short
        continue-on-error: true

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/web/package-lock.json

      - name: Install dependencies
        run: cd clients/web && npm ci

      - name: TypeScript type check
        run: cd clients/web && npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: cd clients/web && npm run build
