name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, Lint & Security
    runs-on: ubuntu-latest

    env:
      LITE_MODE: "true"
      JWT_SECRET: "ci-test-secret-not-for-production"
      DEBUG: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Format check (black)
        run: black --check . --line-length 100

      - name: Import sort check (isort)
        run: isort --check-only .

      - name: Lint (flake8)
        run: flake8 . --max-line-length=100 --ignore=E501,W503

      - name: Type check (mypy)
        run: mypy services/api --ignore-missing-imports
        continue-on-error: true

      - name: Security scan (bandit)
        run: bandit -r services/api/ shared/ -ll --exclude tests/

      - name: Dependency vulnerability scan (safety)
        run: safety check
        continue-on-error: true

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --cov=services/api --cov-report=xml
        env:
          LITE_MODE: "true"
          JWT_SECRET: "ci-test-secret-not-for-production"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/web/package-lock.json

      - name: Install dependencies
        run: cd clients/web && npm ci

      - name: Lint
        run: cd clients/web && npm run lint
        continue-on-error: true

      - name: TypeScript type check
        run: cd clients/web && npx tsc --noEmit

      - name: Build
        run: cd clients/web && npm run build
