providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = ["python311", "gcc", "git"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip",
    "/opt/venv/bin/pip install -r services/api/requirements.txt",
    "/opt/venv/bin/pip install -r services/analysis/requirements.txt",
    "/opt/venv/bin/pip install tree-sitter tree-sitter-python tree-sitter-javascript tree-sitter-typescript"
]

[start]
cmd = "/opt/venv/bin/python test_app2.py"
